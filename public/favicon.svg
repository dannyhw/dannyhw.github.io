<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <style>
    .mark { color: #0d111a; }
    @media (prefers-color-scheme: dark) {
      .mark { color: #e5e9f1; }
    }
  </style>
  <g class="mark">
    <mask id="gap">
      <rect width="48" height="48" fill="#fff"/>
      <circle cx="40.5" cy="14.2" r="6" fill="#000"/>
    </mask>
    <ellipse cx="24" cy="24" rx="20" ry="9" transform="rotate(-24 24 24)" stroke="currentColor" stroke-width="2.5" opacity="0.9" mask="url(#gap)"/>
    <circle cx="24" cy="24" r="6.5" fill="currentColor"/>
    <circle cx="40.5" cy="14.2" r="4" fill="#00b4ff"/>
  </g>
</svg>
